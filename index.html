<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghibli Adventure</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключение рюкзака -->
    <link rel="stylesheet" href="backpack/backpack.css">
    <link rel="stylesheet" href="start/start.css">
</head>
<body>
    <div id="game-container">
        <div id="location-container">
            <div id="location-1" class="location active">
                <div class="player-healthbar"><span class="health-text">10 / 10</span><div class="health-bar"><div class="health-bar-inner" style="width:100%"></div></div></div>
                <div class="player"></div>
                <div class="exit-door"></div>
                <div class="chest"></div>
                <div class="battle-log hidden" id="battle-log"></div>
            </div>
            <div id="location-2" class="location">
                <div class="player-healthbar"><span class="health-text">10 / 10</span><div class="health-bar"><div class="health-bar-inner" style="width:100%"></div></div></div>
                <div class="player"></div>
                <div class="exit-door"></div>
                <div class="chest"></div>
                <div class="battle-log hidden" id="battle-log"></div>
            </div>
            <div id="location-3" class="location">
                <div class="player-healthbar"><span class="health-text">10 / 10</span><div class="health-bar"><div class="health-bar-inner" style="width:100%"></div></div></div>
                <div class="player"></div>
                <div class="enemy-healthbar"><span class="health-text">7 / 7</span><div class="health-bar"><div class="health-bar-inner" style="width:100%"></div></div></div>
                <div class="enemy"></div>
                <div class="exit-door"></div>
                <div class="chest"></div>
                <div class="battle-log hidden" id="battle-log"></div>
            </div>
            <div id="location-4" class="location">
                <div class="player-healthbar"><span class="health-text">10 / 10</span><div class="health-bar"><div class="health-bar-inner" style="width:100%"></div></div></div>
                <div class="player"></div>
                <div class="exit-door"></div>
                <div class="chest"></div>
                <div class="battle-log hidden" id="battle-log"></div>
            </div>
        </div>
    </div>
    <!-- Рюкзак будет подключён отдельным файлом -->
    <script type="module" src="game.js"></script>
    <div id="backpack-root"></div>
    <script>
      fetch('backpack/backpack.html')
        .then(r => r.text())
        .then(html => {
          document.getElementById('backpack-root').innerHTML = html;
          const script = document.createElement('script');
          script.src = 'backpack/backpack.js';
          script.type = 'module';
          document.body.appendChild(script);
        });
    </script>
    <!-- Модальное окно выбора предмета -->
    <div id="item-select-modal" class="hidden">
      <div class="item-select-content">
        <div class="item-option" data-item="sword"><div class="item-icon sword"></div><div>Меч</div></div>
        <div class="item-option" data-item="shield"><div class="item-icon shield"></div><div>Щит</div></div>
        <div class="item-option" data-item="potion"><div class="item-icon potion"></div><div>Зелье</div></div>
      </div>
    </div>
    <div id="start-root"></div>
    <script>
      fetch('start/start.html')
        .then(r => r.text())
        .then(html => {
          document.getElementById('start-root').innerHTML = html;
        });
    </script>
    <audio id="game-music" src="music/music.mp3" loop></audio>
    <audio id="battle-music" src="music/music_battle.mp3" loop></audio>
</body>
</html>
